name: Build & Release Wolfi Rootfs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (Optional: leaves empty to auto-generate based on image digest)'
        required: false
        default: ''

  schedule:
    # Runs daily at midnight to check for updates (only builds if there's a new Wolfi OS version)
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.check.outputs.needs_build }}
      short_digest: ${{ steps.get_digest.outputs.short_digest }}
    steps:
      - name: Get latest Wolfi base digest
        id: get_digest
        run: |
          # Use skopeo to fetch the image digest without downloading the whole image
          DIGEST=$(skopeo inspect docker://cgr.dev/chainguard/wolfi-base:latest | jq -r '.Digest')
          # Extract the first 12 characters of the hash to use as a release tag
          SHORT_DIGEST=$(echo $DIGEST | cut -d':' -f2 | cut -c1-12)
          echo "short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT
          echo "Found latest Wolfi digest: $SHORT_DIGEST"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Always build if triggered manually
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if a GitHub release with this digest already exists in this repo
          if gh release view "wolfi-${{ steps.get_digest.outputs.short_digest }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "✅ We already have a release for this Wolfi version (wolfi-${{ steps.get_digest.outputs.short_digest }}). Skipping build."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 New Wolfi base image detected! A new build is required."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-update
    # Only run this job if check-update says a build is needed
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Wolfi rootfs with pre-installed packages
        run: |
          echo "🐺 Building Wolfi Rootfs for Termix"
          echo "===================================="

          mkdir -p output

          # Packages to pre-install
          PACKAGES="fastfetch curl git gh bash"

          # ---- aarch64 ----
          echo ""
          echo "📦 [1/2] Building for aarch64 (ARM64)..."
          docker pull --platform linux/arm64 cgr.dev/chainguard/wolfi-base:latest
          docker run -d --platform linux/arm64 --name wolfi-arm64 cgr.dev/chainguard/wolfi-base:latest sleep 3600
          docker exec wolfi-arm64 /bin/sh -c "apk update && apk upgrade && apk add --no-cache $PACKAGES && ln -sf /bin/bash /bin/sh && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*"
          docker stop wolfi-arm64
          docker export wolfi-arm64 -o output/wolfi-rootfs-aarch64.tar
          docker rm wolfi-arm64
          tar --delete -f output/wolfi-rootfs-aarch64.tar dev .dockerenv etc/hostname etc/hosts etc/resolv.conf
          gzip -f output/wolfi-rootfs-aarch64.tar
          echo "   ✅ aarch64: $(du -h output/wolfi-rootfs-aarch64.tar.gz | cut -f1)"

          # ---- x86_64 ----
          echo ""
          echo "📦 [2/2] Building for x86_64..."
          docker pull --platform linux/amd64 cgr.dev/chainguard/wolfi-base:latest
          docker run -d --platform linux/amd64 --name wolfi-amd64 cgr.dev/chainguard/wolfi-base:latest sleep 3600
          docker exec wolfi-amd64 /bin/sh -c "apk update && apk upgrade && apk add --no-cache $PACKAGES && ln -sf /bin/bash /bin/sh && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*"
          docker stop wolfi-amd64
          docker export wolfi-amd64 -o output/wolfi-rootfs-x86_64.tar
          docker rm wolfi-amd64
          tar --delete -f output/wolfi-rootfs-x86_64.tar dev .dockerenv etc/hostname etc/hosts etc/resolv.conf
          gzip -f output/wolfi-rootfs-x86_64.tar
          echo "   ✅ x86_64: $(du -h output/wolfi-rootfs-x86_64.tar.gz | cut -f1)"

          echo ""
          echo "🎉 All builds complete!"
          echo ""
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-rootfs-${{ github.run_id }}
          path: output/*.tar.gz
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use manual version if provided, otherwise auto-generate tag like "wolfi-a1b2c3d4e5f6"
          tag_name: ${{ github.event.inputs.version || format('wolfi-{0}', needs.check-update.outputs.short_digest) }}
          name: ${{ github.event.inputs.version || format('Wolfi Rootfs (Update {0})', needs.check-update.outputs.short_digest) }}
          body: |
            🐺 **Wolfi Linux Rootfs for Termix**

            Built from `cgr.dev/chainguard/wolfi-base:latest` (Digest: `${{ needs.check-update.outputs.short_digest }}`)

            ### 📦 Pre-installed packages
            `fastfetch` `curl` `git` `gh` `bash`

            Install more with:
            ```bash
            apk add <package>
            ```

            ### 📥 Downloads

            | File | Architecture | Use for |
            |------|-------------|---------|
            | `wolfi-rootfs-aarch64.tar.gz` | ARM64 | Most modern Android phones |
            | `wolfi-rootfs-x86_64.tar.gz` | x86_64 | Emulators, ChromeOS |

            > ⚠️ Wolfi does not support ARM32 (armv7).
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
