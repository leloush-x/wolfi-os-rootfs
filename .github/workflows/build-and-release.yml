name: Build & Release Wolfi Rootfs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (Optional: leaves empty to auto-generate based on image digest)'
        required: false
        default: ''

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

env:
  WOLFI_IMAGE: cgr.dev/chainguard/wolfi-base:latest
  VOID_IMAGE: ghcr.io/void-linux/void-glibc-busybox:latest
  DEBIAN_IMAGE: debian:slim

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.check.outputs.needs_build }}
      short_digest: ${{ steps.get_digest.outputs.short_digest }}
    steps:
      - name: Get latest Wolfi base digest
        id: get_digest
        run: |
          DIGEST=$(skopeo inspect docker://cgr.dev/chainguard/wolfi-base:latest | jq -r '.Digest')
          SHORT_DIGEST=$(echo $DIGEST | cut -d':' -f2 | cut -c1-12)
          echo "short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT
          echo "Found latest Wolfi digest: $SHORT_DIGEST"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Forcing build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "wolfi-${{ steps.get_digest.outputs.short_digest }}" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "Release wolfi-${{ steps.get_digest.outputs.short_digest }} already exists. Skipping."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "New Wolfi base image detected. Build required."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build-wolfi:
    needs: check-update
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Wolfi rootfs
        run: |
          echo "Building Wolfi Rootfs for Termix"
          mkdir -p output
          PACKAGES="fastfetch curl git gh bash openssh"

          build_one() {
            local platform="$1" name="$2" arch="$3"
            echo "Wolfi $arch"
            docker pull --platform "$platform" cgr.dev/chainguard/wolfi-base:latest
            docker run -d --platform "$platform" --name "$name" cgr.dev/chainguard/wolfi-base:latest sleep 3600
            docker exec "$name" /bin/sh -c "apk update && apk upgrade && apk add --no-cache $PACKAGES && ln -sf /bin/bash /bin/sh && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/* /usr/share/doc/* /usr/share/man/*"
            docker stop "$name"
            docker export "\( name" -o "output/wolfi-rootfs- \){arch}.tar"
            docker rm "$name"
            tar --delete -f "output/wolfi-rootfs-${arch}.tar" dev .dockerenv etc/hostname etc/hosts etc/resolv.conf || true
            gzip -f "output/wolfi-rootfs-${arch}.tar"
            echo "  $arch: \( (du -h output/wolfi-rootfs- \){arch}.tar.gz | cut -f1)"
          }

          build_one linux/arm64 wolfi-arm64 aarch64
          build_one linux/amd64 wolfi-amd64 x86_64
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: wolfi-rootfs
          path: output/*.tar.gz
          retention-days: 3

  build-void:
    needs: check-update
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Void glibc busybox (ultra thin) rootfs
        run: |
          echo "Building Void glibc-busybox Rootfs for Termix"
          mkdir -p output
          PACKAGES="fastfetch curl git github-cli bash openssh"

          build_one() {
            local platform="$1" name="$2" arch="$3"
            echo "Void busybox $arch"
            docker pull --platform "$platform" ghcr.io/void-linux/void-glibc-busybox:latest
            docker run -d --platform "$platform" --name "$name" ghcr.io/void-linux/void-glibc-busybox:latest sleep 3600
            docker exec "$name" /bin/sh -c "
              xbps-install -Syu
              xbps-install -y $PACKAGES
              ln -sf /bin/bash /bin/sh
              rm -rf /var/cache/xbps/* /tmp/* /var/tmp/* /var/log/* \
                     /usr/share/doc/* /usr/share/man/* /usr/share/info/* \
                     /usr/share/locale/* /usr/share/licenses/*
            "
            docker stop "$name"
            docker export "\( name" -o "output/void-glibc-rootfs- \){arch}.tar"
            docker rm "$name"
            tar --delete -f "output/void-glibc-rootfs-${arch}.tar" dev .dockerenv etc/hostname etc/hosts etc/resolv.conf || true
            gzip -f "output/void-glibc-rootfs-${arch}.tar"
            echo "  $arch: \( (du -h output/void-glibc-rootfs- \){arch}.tar.gz | cut -f1)"
          }

          build_one linux/arm64 void-arm64 aarch64
          build_one linux/amd64 void-amd64 x86_64
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: void-glibc-rootfs
          path: output/*.tar.gz
          retention-days: 3

  build-debian:
    needs: check-update
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Debian latest slim (ultra thin) rootfs
        run: |
          echo "Building Debian slim Rootfs for Termix"
          mkdir -p output
          PACKAGES="fastfetch curl git gh bash openssh-client ca-certificates"

          build_one() {
            local platform="$1" name="$2" arch="$3"
            echo "Debian slim $arch"
            docker pull --platform "$platform" debian:slim
            docker run -d --platform "$platform" --name "$name" debian:slim sleep 3600
            docker exec "$name" /bin/sh -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends $PACKAGES
              apt-get autoremove -y --purge
              apt-get clean
              ln -sf /bin/bash /bin/sh
              rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* \
                     /tmp/* /var/tmp/* /var/log/* \
                     /usr/share/doc/* /usr/share/man/* /usr/share/info/* \
                     /usr/share/lintian/* /usr/share/locale/* \
                     /usr/share/zsh /usr/share/gcc /usr/share/gdb
            "
            docker stop "$name"
            docker export "\( name" -o "output/debian-slim-rootfs- \){arch}.tar"
            docker rm "$name"
            tar --delete -f "output/debian-slim-rootfs-${arch}.tar" dev .dockerenv etc/hostname etc/hosts etc/resolv.conf || true
            gzip -f "output/debian-slim-rootfs-${arch}.tar"
            echo "  $arch: \( (du -h output/debian-slim-rootfs- \){arch}.tar.gz | cut -f1)"
          }

          build_one linux/arm64 debian-arm64 aarch64
          build_one linux/amd64 debian-amd64 x86_64
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-slim-rootfs
          path: output/*.tar.gz
          retention-days: 3

  release:
    needs: [check-update, build-wolfi, build-void, build-debian]
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || format('wolfi-{0}', needs.check-update.outputs.short_digest) }}
          name: ${{ github.event.inputs.version || format('Wolfi + Void + Debian Rootfs (Update {0})', needs.check-update.outputs.short_digest) }}
          body: |
            Rootfs tarballs for Termux / proot-distro (glibc, terminal only, ultra thin).

            Triggered from Wolfi `cgr.dev/chainguard/wolfi-base:latest` (Digest: `${{ needs.check-update.outputs.short_digest }}`)

            Also built:
            - `ghcr.io/void-linux/void-glibc-busybox:latest` (thinnest official Void glibc)
            - `debian:slim` (latest stable slim)

            ### Pre-installed
            `fastfetch` `curl` `git` `gh` `bash` `openssh`

            | Distro | Install more with |
            |--------|-------------------|
            | Wolfi | `apk add <pkg>` |
            | Void glibc busybox | `xbps-install -S <pkg>` |
            | Debian slim | `apt install <pkg>` |

            ### Downloads

            | File | Distro | Arch | Use for |
            |------|--------|------|---------|
            | `wolfi-rootfs-aarch64.tar.gz` | Wolfi | ARM64 | phones |
            | `wolfi-rootfs-x86_64.tar.gz` | Wolfi | x86_64 | emulators, ChromeOS |
            | `void-glibc-rootfs-aarch64.tar.gz` | Void glibc busybox | ARM64 | phones |
            | `void-glibc-rootfs-x86_64.tar.gz` | Void glibc busybox | x86_64 | emulators, ChromeOS |
            | `debian-slim-rootfs-aarch64.tar.gz` | Debian slim | ARM64 | phones |
            | `debian-slim-rootfs-x86_64.tar.gz` | Debian slim | x86_64 | emulators, ChromeOS |

            ### Termux

            ```bash
            pkg install proot-distro
            proot-distro install ./wolfi-rootfs-aarch64.tar.gz --name wolfi
            proot-distro install ./void-glibc-rootfs-aarch64.tar.gz --name void
            proot-distro install ./debian-slim-rootfs-aarch64.tar.gz --name debian
            proot-distro login wolfi
            ```

            > These images do not support ARM32 (armv7).
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
