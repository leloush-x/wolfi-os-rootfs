name: Build & Release Multi-Distro Rootfs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Custom release tag (leave empty for auto-generated digest hash)'
        required: false
        default: ''

  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      needs-build: ${{ steps.check.outputs.needs_build }}
      release_tag: ${{ steps.get_digest.outputs.release_tag }}
    steps:
      - name: Calculate Upstream Image Fingerprint
        id: get_digest
        run: |
          # Query image manifests without pulling full image layers
          WOLFI_DIGEST=$(skopeo inspect docker://cgr.dev/chainguard/wolfi-base:latest | jq -r '.Digest // empty')
          DEBIAN_DIGEST=$(skopeo inspect docker://debian:bookworm-slim | jq -r '.Digest // empty')
          VOID_DIGEST=$(skopeo inspect docker://ghcr.io/void-linux/void-linux:latest-glibc | jq -r '.Digest // empty')

          echo "Wolfi:  $WOLFI_DIGEST"
          echo "Debian: $DEBIAN_DIGEST"
          echo "Void:   $VOID_DIGEST"

          # Create a consolidated short hash of all three upstream states
          BUNDLE_HASH=$(echo -n "${WOLFI_DIGEST}:${DEBIAN_DIGEST}:${VOID_DIGEST}" | sha256sum | cut -c1-12)
          RELEASE_TAG="distros-${BUNDLE_HASH}"
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $RELEASE_TAG"

      - name: Evaluate Build Necessity
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual execution triggered. Proceeding with build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          TARGET_TAG="${{ steps.get_digest.outputs.release_tag }}"
          if gh release view "$TARGET_TAG" --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "✅ Release $TARGET_TAG already exists and is up-to-date. Skipping."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 New upstream image versions detected. Triggering build matrix."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.needs-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: wolfi
            image: cgr.dev/chainguard/wolfi-base:latest
            # Wolfi apk package bootstrap
            cmd: >-
              apk update && apk upgrade &&
              apk add --no-cache fastfetch curl git gh bash openssh &&
              ln -sf /bin/bash /bin/sh &&
              rm -f /etc/resolv.conf /etc/hosts /etc/hostname &&
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf &&
              rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*

          - name: debian
            image: debian:bookworm-slim
            # Debian apt package bootstrap (avoids package not found traps)
            cmd: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
              ca-certificates curl git bash openssh-client procps less nano &&
              rm -f /etc/resolv.conf /etc/hosts /etc/hostname &&
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf &&
              rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/* /var/log/*

          - name: void
            image: ghcr.io/void-linux/void-linux:latest-glibc
            # Void xbps package bootstrap (updates xbps itself first to prevent ABI issues)
            cmd: >-
              xbps-install -Syu xbps &&
              xbps-install -Syu &&
              xbps-install -y ca-certificates curl git bash openssh less nano &&
              rm -f /etc/resolv.conf /etc/hosts /etc/hostname &&
              printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /etc/resolv.conf &&
              rm -rf /var/cache/xbps/* /tmp/* /var/tmp/* /var/log/*

        arch:
          - id: aarch64
            platform: linux/arm64
          - id: x86_64
            platform: linux/amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rootfs Tarball
        run: |
          DISTRO="${{ matrix.distro.name }}"
          ARCH="${{ matrix.arch.id }}"
          PLATFORM="${{ matrix.arch.platform }}"
          IMAGE="${{ matrix.distro.image }}"
          CONTAINER_NAME="build-${DISTRO}-${ARCH}"
          TAR_NAME="${DISTRO}-rootfs-${ARCH}.tar"

          mkdir -p dist

          echo "🚀 Pulling $IMAGE for$PLATFORM..."
          docker pull --platform "$PLATFORM" "$IMAGE"

          echo "🛠️ Creating container $CONTAINER_NAME..."
          docker run -d --platform "$PLATFORM" --name "$CONTAINER_NAME" "$IMAGE" sleep 3600

          echo "📦 Executing package setup..."
          docker exec "$CONTAINER_NAME" /bin/sh -c "${{ matrix.distro.cmd }}"

          echo "💾 Exporting root filesystem..."
          docker stop "$CONTAINER_NAME"
          docker export "$CONTAINER_NAME" -o "dist/${TAR_NAME}"
          docker rm "$CONTAINER_NAME"

          echo "🧹 Sanitizing PRoot/Termix paths safely..."
          # Strip host/docker artifacts; ignore exit code if an entry does not exist to prevent aborting
          tar --delete -f "dist/${TAR_NAME}" dev .dockerenv 2>/dev/null || true

          echo "🗜️ Compressing to gzip..."
          gzip -9 -f "dist/${TAR_NAME}"

          echo "Artifact created: dist/${TAR_NAME}.gz ($(du -h dist/${TAR_NAME}.gz | cut -f1))"

      - name: Upload Single Rootfs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro.name }}-rootfs-${{ matrix.arch.id }}
          path: dist/*.tar.gz
          retention-days: 1

  publish:
    needs: [check-update, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || needs.check-update.outputs.release_tag }}
          name: ${{ github.event.inputs.version || format('Multi-Distro Rootfs ({0})', needs.check-update.outputs.release_tag) }}
          body: |
            ### 🌐 Lightweight Multi-Architecture Rootfs for Termix & PRoot

            Automated build supporting `aarch64` (ARM64) and `x86_64` (AMD64).

            ---

            ### 📦 Included Distributions & Default Tooling

            | Distribution | Base Image | Package Manager | Pre-installed Packages |
            | :--- | :--- | :--- | :--- |
            | **Wolfi Linux** | `cgr.dev/chainguard/wolfi-base` | `apk` | `fastfetch`, `curl`, `git`, `gh`, `bash`, `openssh` |
            | **Debian Slim** | `debian:bookworm-slim` | `apt` | `curl`, `git`, `bash`, `openssh-client`, `procps`, `less`, `nano` |
            | **Void Linux** | `ghcr.io/void-linux/void-linux` | `xbps` | `curl`, `git`, `bash`, `openssh`, `less`, `nano` |

            ---

            ### 🗂️ Available Files

            * `wolfi-rootfs-aarch64.tar.gz` / `wolfi-rootfs-x86_64.tar.gz`
            * `debian-rootfs-aarch64.tar.gz` / `debian-rootfs-x86_64.tar.gz`
            * `void-rootfs-aarch64.tar.gz` / `void-rootfs-x86_64.tar.gz`
            * `SHA256SUMS.txt` (Integrity checksums)

            > Cleaned for terminal emulators: `.dockerenv` removed, dynamic `/dev` unlinked, and fallback DNS configured (`1.1.1.1`, `8.8.8.8`).
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
