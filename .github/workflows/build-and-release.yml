name: Build & Release Wolfi Rootfs

on:
  # Manual trigger - click "Run workflow" to build
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

  # Auto-build every Sunday (keep Wolfi updated)
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Wolfi rootfs for all architectures
        run: |
          echo "🐺 Building Wolfi Rootfs for Termix"
          echo "===================================="
          echo ""
          
          mkdir -p output
          
          # ---- aarch64 (most Android phones) ----
          echo "📦 [1/3] Building for aarch64 (ARM64)..."
          docker pull --platform linux/arm64 cgr.dev/chainguard/wolfi-base:latest
          cid=$(docker create --platform linux/arm64 cgr.dev/chainguard/wolfi-base:latest)
          docker export "$cid" | gzip > output/wolfi-rootfs-aarch64.tar.gz
          docker rm "$cid"
          echo "   ✅ aarch64: $(du -h output/wolfi-rootfs-aarch64.tar.gz | cut -f1)"
          echo ""
          
          # ---- x86_64 (emulators / ChromeOS) ----
          echo "📦 [2/3] Building for x86_64..."
          docker pull --platform linux/amd64 cgr.dev/chainguard/wolfi-base:latest
          cid=$(docker create --platform linux/amd64 cgr.dev/chainguard/wolfi-base:latest)
          docker export "$cid" | gzip > output/wolfi-rootfs-x86_64.tar.gz
          docker rm "$cid"
          echo "   ✅ x86_64: $(du -h output/wolfi-rootfs-x86_64.tar.gz | cut -f1)"
          echo ""
          
          # ---- armv7 (older ARM devices) ----
          echo "📦 [3/3] Building for armv7 (ARM32)..."
          docker pull --platform linux/arm/v7 cgr.dev/chainguard/wolfi-base:latest
          cid=$(docker create --platform linux/arm/v7 cgr.dev/chainguard/wolfi-base:latest)
          docker export "$cid" | gzip > output/wolfi-rootfs-armv7.tar.gz
          docker rm "$cid"
          echo "   ✅ armv7: $(du -h output/wolfi-rootfs-armv7.tar.gz | cut -f1)"
          echo ""
          
          echo "🎉 All builds complete!"
          echo ""
          ls -lh output/

      - name: Upload artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-rootfs-${{ github.run_id }}
          path: output/*.tar.gz
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || 'wolfi-latest' }}
          name: "Wolfi Rootfs ${{ github.event.inputs.version || 'latest' }}"
          body: |
            🐺 **Wolfi Linux Rootfs for Termix**
            
            Built from: `cgr.dev/chainguard/wolfi-base:latest`
            Package manager: `apk` (same as Alpine)
            
            ---
            
            ### 📥 Downloads
            
            | File | Architecture | Use for |
            |------|-------------|---------|
            | `wolfi-rootfs-aarch64.tar.gz` | ARM64 | Most modern Android phones |
            | `wolfi-rootfs-x86_64.tar.gz` | x86_64 | Emulators, ChromeOS |
            | `wolfi-rootfs-armv7.tar.gz` | ARM32 | Older Android devices |
            
            ---
            
            ### 🔧 Usage in Termix
            
            1. Download the file matching your device's CPU
            2. Place it in Termix app data directory
            3. Termix will auto-detect and extract it
            
            ---
            
            ### 📦 What's inside
            
            - Minimal Wolfi base system
            - `apk` package manager
            - Shell: `/bin/sh` (busybox)
            
            Install packages with:
            ```bash
            apk add bash git curl wget
            ```
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
