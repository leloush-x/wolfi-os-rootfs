name: Build & Release Rootfs (Wolfi, Void, Debian)

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Which distro to build'
        required: false
        default: 'all'
        type: choice
        options: [all, wolfi, void, debian]
      version:
        description: 'Version tag prefix (Optional: leave empty to auto-generate from image digest)'
        required: false
        default: ''

  schedule:
    # Daily check; only builds distros whose base image digest changed
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_builds: ${{ steps.check.outputs.has_builds }}
    steps:
      - name: Check base image digests
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          declare -A IMAGES=(
            [wolfi]="cgr.dev/chainguard/wolfi-base:latest"
            [void]="ghcr.io/void-linux/void-glibc:latest"
            [debian]="docker.io/library/debian:stable-slim"
          )

          SELECTED="${{ github.event.inputs.distro || 'all' }}"
          MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
          VERSION="${{ github.event.inputs.version }}"
          MATRIX="[]"

          for DISTRO in wolfi void debian; do
            if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$DISTRO" ]; then
              continue
            fi

            IMAGE="${IMAGES[$DISTRO]}"
            DIGEST=$(skopeo inspect "docker://$IMAGE" | jq -r '.Digest')
            SHORT=$(echo "$DIGEST" | cut -d':' -f2 | cut -c1-12)

            if [ -n "$VERSION" ]; then
              TAG="${VERSION}-${DISTRO}"
            else
              TAG="${DISTRO}-${SHORT}"
            fi

            echo "[$DISTRO] digest: $SHORT"

            if [ "$MANUAL" != "true" ] && gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "✅ [$DISTRO] release $TAG already exists. Skipping."
              continue
            fi

            echo "🚨 [$DISTRO] build required ($TAG)"
            MATRIX=$(echo "$MATRIX" | jq -c --arg d "$DISTRO" --arg i "$IMAGE" --arg s "$SHORT" --arg t "$TAG" \
              '. + [{distro:$d, image:$i, short_digest:$s, tag:$t}]')
          done

          if [ "$MATRIX" = "[]" ]; then
            echo "has_builds=false" >> $GITHUB_OUTPUT
          else
            echo "has_builds=true" >> $GITHUB_OUTPUT
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: check-update
    if: needs.check-update.outputs.has_builds == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check-update.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.distro }} rootfs
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "🐧 Building $DISTRO rootfs from $IMAGE"
          mkdir -p output

          # Per-distro install command (terminal-only, minimal)
          case "$DISTRO" in
            wolfi)
              INSTALL='apk update && apk upgrade && apk add --no-cache fastfetch curl git gh bash openssh \
                && ln -sf /bin/bash /bin/sh \
                && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*'
              ;;
            void)
              INSTALL='xbps-install -Syu xbps && xbps-install -Syu \
                && xbps-install -y fastfetch curl git github-cli bash openssh ca-certificates \
                && xbps-remove -Oo -y || true; \
                rm -rf /var/cache/xbps/* /tmp/* /var/tmp/* /var/log/*'
              ;;
            debian)
              INSTALL='export DEBIAN_FRONTEND=noninteractive \
                && apt-get update && apt-get upgrade -y \
                && apt-get install -y --no-install-recommends fastfetch curl git gh bash openssh-client ca-certificates \
                && apt-get clean \
                && rm -rf /var/lib/apt/lists/* /usr/share/doc/* /usr/share/man/* /tmp/* /var/tmp/* /var/log/*'
              ;;
          esac

          build_arch() {
            local NAME=$1 PLATFORM=$2 CONTAINER="${DISTRO}-$1"

            echo ""
            echo "📦 Building $DISTRO for $NAME ($PLATFORM)..."
            docker pull --platform "$PLATFORM" "$IMAGE"
            docker run -d --platform "$PLATFORM" --name "$CONTAINER" "$IMAGE" sleep 3600
            docker exec "$CONTAINER" /bin/sh -c "$INSTALL"
            docker stop "$CONTAINER"
            docker export "$CONTAINER" -o "output/${DISTRO}-rootfs-${NAME}.tar"
            docker rm "$CONTAINER"
            tar --delete -f "output/${DISTRO}-rootfs-${NAME}.tar" dev .dockerenv etc/hostname etc/hosts etc/resolv.conf || true
            gzip -f "output/${DISTRO}-rootfs-${NAME}.tar"
            echo "   ✅ $NAME: $(du -h output/${DISTRO}-rootfs-${NAME}.tar.gz | cut -f1)"
          }

          build_arch aarch64 linux/arm64
          build_arch x86_64 linux/amd64

          echo ""
          ls -lh output/

      - name: Prepare release notes
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
          SHORT: ${{ matrix.short_digest }}
        run: |
          case "$DISTRO" in
            wolfi)
              TITLE="Wolfi Linux (musl-free glibc, apk)"
              PKGS='`fastfetch` `curl` `git` `gh` `bash` `openssh`'
              MORE='apk add <package>'
              EXTRA='> ⚠️ Wolfi does not support ARM32 (armv7).'
              ;;
            void)
              TITLE="Void Linux (glibc, xbps)"
              PKGS='`fastfetch` `curl` `git` `github-cli` `bash` `openssh`'
              MORE='xbps-install -S <package>'
              EXTRA='> ℹ️ glibc variant of Void Linux.'
              ;;
            debian)
              TITLE="Debian stable-slim (glibc, apt)"
              PKGS='`fastfetch` `curl` `git` `gh` `bash` `openssh-client`'
              MORE='apt update && apt install <package>'
              EXTRA='> ℹ️ Based on `debian:stable-slim`, docs and man pages stripped.'
              ;;
          esac

          cat > release-body.md <<EOF
          🐧 **$TITLE Rootfs for Termix**

          Built from \`$IMAGE\` (Digest: \`$SHORT\`)

          ### 📦 Pre-installed packages
          $PKGS

          Install more with:
          \`\`\`bash
          $MORE
          \`\`\`

          ### 📥 Downloads

          | File | Architecture | Use for |
          |------|-------------|---------|
          | \`${DISTRO}-rootfs-aarch64.tar.gz\` | ARM64 | Most modern Android phones |
          | \`${DISTRO}-rootfs-x86_64.tar.gz\` | x86_64 | Emulators, ChromeOS |

          $EXTRA
          EOF

          # Strip heredoc indentation
          sed -i 's/^          //' release-body.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-rootfs-${{ github.run_id }}
          path: output/*.tar.gz
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.distro }} Rootfs (${{ matrix.tag }})
          body_path: release-body.md
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
