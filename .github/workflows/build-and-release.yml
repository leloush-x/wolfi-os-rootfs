name: Build & Release Rootfs (Wolfi, Void, Debian)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (Optional: leave empty to auto-generate from image digests)'
        required: false
        default: ''

  schedule:
    # Daily check; builds only if any of the three base images changed
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      tag: ${{ steps.check.outputs.tag }}
      wolfi_digest: ${{ steps.check.outputs.wolfi_digest }}
      void_digest: ${{ steps.check.outputs.void_digest }}
      debian_digest: ${{ steps.check.outputs.debian_digest }}
    steps:
      - name: Check base image digests
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_digest() {
            skopeo inspect "docker://$1" | jq -r '.Digest' | cut -d':' -f2 | cut -c1-12
          }

          WOLFI=$(short_digest cgr.dev/chainguard/wolfi-base:latest)
          VOID=$(short_digest ghcr.io/void-linux/void-glibc:latest)
          DEBIAN=$(short_digest docker.io/library/debian:stable-slim)

          echo "wolfi:  $WOLFI"
          echo "void:   $VOID"
          echo "debian: $DEBIAN"

          echo "wolfi_digest=$WOLFI"   >> $GITHUB_OUTPUT
          echo "void_digest=$VOID"     >> $GITHUB_OUTPUT
          echo "debian_digest=$DEBIAN" >> $GITHUB_OUTPUT

          # Tag: manual version (sanitized) or hash of all three digests
          VERSION="${{ github.event.inputs.version }}"
          VERSION=$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-' | sed 's/^-*//; s/-*$//')

          if [ -n "$VERSION" ]; then
            TAG="$VERSION"
          else
            COMBINED=$(printf '%s' "$WOLFI$VOID$DEBIAN" | sha256sum | cut -c1-12)
            TAG="rootfs-$COMBINED"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger. Forcing build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "✅ Release $TAG already exists. Skipping build."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "🚨 Base image update detected. Build required ($TAG)."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-update
    if: needs.check-update.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - distro: wolfi
            image: cgr.dev/chainguard/wolfi-base:latest
          - distro: void
            image: ghcr.io/void-linux/void-glibc:latest
          - distro: debian
            image: docker.io/library/debian:stable-slim

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.distro }} rootfs
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "🐧 Building $DISTRO rootfs from $IMAGE"
          mkdir -p output

          case "$DISTRO" in
            wolfi)
              INSTALL='apk update && apk upgrade && apk add --no-cache fastfetch curl git gh bash openssh \
                && ln -sf /bin/bash /bin/sh \
                && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*'
              ;;
            void)
              INSTALL='xbps-install -Syu xbps && xbps-install -Syu \
                && xbps-install -y fastfetch curl git github-cli bash openssh ca-certificates; \
                rm -rf /var/cache/xbps/* /tmp/* /var/tmp/* /var/log/*'
              ;;
            debian)
              INSTALL='export DEBIAN_FRONTEND=noninteractive \
                && apt-get update && apt-get upgrade -y \
                && apt-get install -y --no-install-recommends fastfetch curl git gh bash openssh-client ca-certificates \
                && apt-get clean \
                && rm -rf /var/lib/apt/lists/* /usr/share/doc/* /usr/share/man/* /tmp/* /var/tmp/* /var/log/*'
              ;;
          esac

          build_arch() {
            local NAME=$1 PLATFORM=$2 CONTAINER="${DISTRO}-$1"

            echo ""
            echo "📦 Building $DISTRO for $NAME ($PLATFORM)..."
            docker pull --platform "$PLATFORM" "$IMAGE"
            docker run -d --platform "$PLATFORM" --name "$CONTAINER" "$IMAGE" sleep 3600
            docker exec "$CONTAINER" /bin/sh -c "$INSTALL"
            docker stop "$CONTAINER"
            docker export "$CONTAINER" -o "output/${DISTRO}-rootfs-${NAME}.tar"
            docker rm "$CONTAINER"
            tar --delete -f "output/${DISTRO}-rootfs-${NAME}.tar" dev .dockerenv etc/hostname etc/hosts etc/resolv.conf || true
            gzip -f "output/${DISTRO}-rootfs-${NAME}.tar"
            echo "   ✅ $NAME: $(du -h output/${DISTRO}-rootfs-${NAME}.tar.gz | cut -f1)"
          }

          build_arch aarch64 linux/arm64
          build_arch x86_64 linux/amd64

          ls -lh output/

      - name: Upload ${{ matrix.distro }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.distro }}
          path: output/*.tar.gz
          retention-days: 3

  release:
    needs: [check-update, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          path: output
          merge-multiple: true

      - name: Prepare release notes
        env:
          WOLFI: ${{ needs.check-update.outputs.wolfi_digest }}
          VOID: ${{ needs.check-update.outputs.void_digest }}
          DEBIAN: ${{ needs.check-update.outputs.debian_digest }}
        run: |
          ls -lh output/

          cat > release-body.md <<EOF
          🐧 **Linux Rootfs Collection for Termix**

          Terminal-only, minimal rootfs images for **ARM64** and **x86_64**.

          ### 📦 Pre-installed packages
          \`fastfetch\` \`curl\` \`git\` \`gh\` \`bash\` \`openssh\`

          ### 📥 Downloads

          | Distro | ARM64 (phones) | x86_64 (emulators, ChromeOS) | Base digest | Install more |
          |--------|----------------|------------------------------|-------------|--------------|
          | Wolfi (glibc) | \`wolfi-rootfs-aarch64.tar.gz\` | \`wolfi-rootfs-x86_64.tar.gz\` | \`$WOLFI\` | \`apk add <pkg>\` |
          | Void (glibc) | \`void-rootfs-aarch64.tar.gz\` | \`void-rootfs-x86_64.tar.gz\` | \`$VOID\` | \`xbps-install -S <pkg>\` |
          | Debian slim | \`debian-rootfs-aarch64.tar.gz\` | \`debian-rootfs-x86_64.tar.gz\` | \`$DEBIAN\` | \`apt install <pkg>\` |

          > ⚠️ Wolfi does not support ARM32 (armv7).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-update.outputs.tag }}
          name: Rootfs Collection (${{ needs.check-update.outputs.tag }})
          body_path: release-body.md
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
