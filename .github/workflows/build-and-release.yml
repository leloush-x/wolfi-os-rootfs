name: Build & Release Wolfi Rootfs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'

  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Wolfi rootfs with pre-installed packages
        run: |
          echo "🐺 Building Wolfi Rootfs for Termix"
          echo "===================================="

          mkdir -p output

          # Packages to pre-install
          PACKAGES="fastfetch curl git"

          # ---- aarch64 ----
          echo ""
          echo "📦 [1/2] Building for aarch64 (ARM64)..."
          docker pull --platform linux/arm64 cgr.dev/chainguard/wolfi-base:latest
          docker run -d --platform linux/arm64 --name wolfi-arm64 cgr.dev/chainguard/wolfi-base:latest sleep 3600
          docker exec wolfi-arm64 /bin/sh -c "apk update && apk add --no-cache $PACKAGES && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*"
          docker stop wolfi-arm64
          docker export wolfi-arm64 | gzip > output/wolfi-rootfs-aarch64.tar.gz
          docker rm wolfi-arm64
          echo "   ✅ aarch64: $(du -h output/wolfi-rootfs-aarch64.tar.gz | cut -f1)"

          # ---- x86_64 ----
          echo ""
          echo "📦 [2/2] Building for x86_64..."
          docker pull --platform linux/amd64 cgr.dev/chainguard/wolfi-base:latest
          docker run -d --platform linux/amd64 --name wolfi-amd64 cgr.dev/chainguard/wolfi-base:latest sleep 3600
          docker exec wolfi-amd64 /bin/sh -c "apk update && apk add --no-cache $PACKAGES && rm -rf /var/cache/apk/* /tmp/* /var/tmp/* /var/log/*"
          docker stop wolfi-amd64
          docker export wolfi-amd64 | gzip > output/wolfi-rootfs-x86_64.tar.gz
          docker rm wolfi-amd64
          echo "   ✅ x86_64: $(du -h output/wolfi-rootfs-x86_64.tar.gz | cut -f1)"

          echo ""
          echo "🎉 All builds complete!"
          echo ""
          ls -lh output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-rootfs-${{ github.run_id }}
          path: output/*.tar.gz
          retention-days: 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || 'wolfi-latest' }}
          name: "Wolfi Rootfs ${{ github.event.inputs.version || 'latest' }}"
          body: |
            🐺 **Wolfi Linux Rootfs for Termix**

            Built from: `cgr.dev/chainguard/wolfi-base:latest`

            ### 📦 Pre-installed packages
            `fastfetch` `curl` `git`

            Install more with:
            ```bash
            apk add <package>
            ```

            ### 📥 Downloads

            | File | Architecture | Use for |
            |------|-------------|---------|
            | `wolfi-rootfs-aarch64.tar.gz` | ARM64 | Most modern Android phones |
            | `wolfi-rootfs-x86_64.tar.gz` | x86_64 | Emulators, ChromeOS |

            > ⚠️ Wolfi does not support ARM32 (armv7).
          files: output/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
